[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ncly"
version = "0.1.0"
description = "Numerical computing with tensors, automatic differentiation, linear algebra and sparse solvers"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["numerical", "tensor", "autodiff", "linear-algebra", "sparse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.maturin]
manifest-path = "../crates/ncly-python/Cargo.toml"
module-name = "ncly"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
