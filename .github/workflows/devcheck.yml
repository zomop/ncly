name: devcheck
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: build, fmt, test
        run: |
          # Every gate runs even after an earlier one fails, so one log holds all
          # the evidence; the accumulated status decides the job result at the end.
          set +e
          status=0
          {
            rustc --version
            echo "=== cargo build ==="
            cargo build --workspace --all-targets 2>&1 | grep -v '^\s*Compiling' | tail -140
            echo "=== cargo fmt --check ==="
            cargo fmt --all -- --check 2>&1 | head -40 || echo "fmt: differences (autofmt will fix)"
            echo "=== cargo clippy (errors only) ==="
            cargo clippy --workspace --all-targets -- -D warnings 2>&1 \
              | grep -E -A 4 '^error' | head -120
            echo "=== cargo test ==="
            # `--no-fail-fast` so every failing test in every crate is reported,
            # `--nocapture` so the assertion values are visible.
            cargo test --workspace --no-fail-fast -- --nocapture 2>&1 \
              | grep -E -A 14 '^---- |^test result: FAILED|^error\[|panicked at' | head -200

            # The gates below are what actually decides the job result. Their
            # output goes into the same log, because a red job with no visible
            # reason is worse than no job at all.
            echo "=== gates ==="
            cargo build --workspace --all-targets --quiet 2>&1 \
              || { echo "GATE FAILED: cargo build"; status=1; }
            cargo test --workspace --quiet 2>&1 \
              || { echo "GATE FAILED: cargo test"; status=1; }
            RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --quiet 2>&1 \
              || { echo "GATE FAILED: cargo doc"; status=1; }

            # The README calls the examples "runnable", so they are run: compiling
            # is not enough, a panicking example still builds. `-p ncly` is required
            # because this is a virtual workspace manifest and the examples are
            # declared in that package.
            for example in tensors autodiff linalg sparse graph; do
              echo "--- example: $example"
              cargo run --quiet --release -p ncly --example "$example" 2>&1 \
                || { echo "GATE FAILED: example $example"; status=1; }
            done
            echo "gates status: $status"
          } > /tmp/log.txt 2>&1
          # Upload before exiting, so a red job still leaves its output on the commit.
          python3 .github/ci/post_log.py /tmp/log.txt
          tail -60 /tmp/log.txt
          exit "$status"
  python:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: build extension and run pytest
        run: |
          set +e
          {
            python3 --version
            python3 -m pip install --quiet --break-system-packages maturin pytest
            cd python
            maturin build --release -o /tmp/wheels 2>&1 | tail -40 || echo "MATURIN FAILED"
            python3 -m pip install --quiet --break-system-packages --force-reinstall /tmp/wheels/*.whl \
              || echo "WHEEL INSTALL FAILED"
            cd ..
            # `conftest.py` skips the suite when the extension is missing, which
            # is convenient locally but would hide a broken build in CI.
            python3 -c "import ncly; print('extension imported:', ncly.__name__)"
            python3 -m pytest python/tests -q 2>&1 | tail -60
          } > /tmp/pylog.txt 2>&1
          python3 .github/ci/post_log.py /tmp/pylog.txt
          tail -25 /tmp/pylog.txt
          # Gates, run after the log is safely uploaded.
          python3 -c "import ncly" || exit 1
          python3 -m pytest python/tests -q || exit 1
