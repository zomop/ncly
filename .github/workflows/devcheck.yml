name: devcheck
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: build, fmt, test
        run: |
          set +e
          {
            rustc --version
            echo "=== cargo build ==="
            cargo build --workspace --all-targets 2>&1 | grep -v '^\s*Compiling' | tail -120
            echo "=== cargo test ==="
            cargo test --workspace 2>&1 | grep -v '^\s*Compiling' | tail -80
            echo "=== cargo fmt --check ==="
            rustfmt --edition 2021 --check $(git ls-files '*.rs') 2>&1 | tail -40
            echo "=== cargo doc (deny warnings) ==="
            RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps 2>&1 | tail -40
          } > /tmp/log.txt 2>&1
          python3 .github/ci/post_log.py /tmp/log.txt
          tail -30 /tmp/log.txt
