name: autofmt

on:
  push:
    branches: ['arena/**']

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: Swatinem/rust-cache@v2
      - name: format and commit when needed
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "ncly-bot"
          git config user.email "ncly-bot@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt"
          git push
