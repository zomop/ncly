name: probe
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: toolchain info
        run: |
          set +e
          { rustc --version; cargo --version; python3 --version; } > /tmp/log.txt 2>&1
          echo "probe ok" >> /tmp/log.txt
          python3 .github/ci/post_log.py /tmp/log.txt
