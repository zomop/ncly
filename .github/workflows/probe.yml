name: probe
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: run
        run: |
          set +e
          { echo "token length: ${#GITHUB_TOKEN}"; rustc --version; cargo --version; } > /tmp/log.txt 2>&1
          echo "probe transport ok" >> /tmp/log.txt
          python3 .github/ci/post_log.py /tmp/log.txt
          cat /tmp/log.txt
